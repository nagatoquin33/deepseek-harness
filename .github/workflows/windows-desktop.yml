# DeepSeek Harness Desktop (Windows) — fork 自动化：直接构建上游，不改 fork 的 master
#
# 设计：
#   每 6 小时（UTC 00:17/06:17/12:17/18:17 = 北京时间 08:17/14:17/20:17/02:17）
#   查询上游 deepseek-ai/deepseek-harness 的 master 最新提交。
#   如果 fork 里还没有对应的 release（tag = win-v<上游版本>-<上游短 sha>），就：
#     1. resolve (ubuntu)  : 解析上游 sha / 版本，判断是否需要构建
#     2. build   (windows) : 直接 checkout 上游该 sha，写入本 fork 的打包配置，打无签名安装包
#     3. publish (ubuntu)  : 在本 fork 创建 GitHub Release 并上传 .exe（release 不会过期）
#
#   为什么不同步 master 再构建：GITHUB_TOKEN 不能推送修改 .github/workflows/* 的提交，
#   而上游经常改工作流；另外同步进来的上游工作流会在 fork 里被启用、白白跑失败。
#   直接构建上游 sha 完全绕开这两个问题。fork 的定制只剩这一个文件（上游不会碰它）。
#
#   “上次构建到哪个上游 sha” 就记录在 release 的 tag 和正文 (upstream-sha: ...) 里，
#   构建失败不会产生 release，下一次定时任务会自动重试。
#
# 手动运行：Actions → windows-desktop → Run workflow
#   - upstream_ref: 上游分支 / tag / sha（默认 master）
#   - force_build : 已有同名 release 时也重新构建并覆盖安装包
#
# 可选：想让 fork 的 master 也跟着上游走，添加仓库 secret SYNC_TOKEN
# （具有 repo + workflow 权限的 PAT）。没有该 secret 时 sync-fork 任务直接跳过，不影响构建。
#
# 产物：deepseek-harness-<版本>-win-x64-unsigned.exe（NSIS 安装器，无签名，
#       SmartScreen 拦截时选“更多信息 → 仍要运行”）
# 固定下载页：https://github.com/<owner>/deepseek-harness/releases/latest

name: windows-desktop

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游分支 / tag / commit sha"
        type: string
        default: master
      force_build:
        description: "已有同名 release 时也强制重新构建"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: windows-desktop
  cancel-in-progress: false

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # 仅用于下面的 keepalive（重新 enable 本工作流）
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      build: ${{ steps.r.outputs.build }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.upstream_ref || 'master' }}
          FORCE: ${{ inputs.force_build || false }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/$UPSTREAM_REPO/commits/$REF" -q .sha)
          VERSION=$(gh api "repos/$UPSTREAM_REPO/contents/package.json?ref=$SHA" \
            -H "Accept: application/vnd.github.raw" | jq -r .version)
          TAG="win-v${VERSION}-${SHA:0:7}"
          BUILD=true
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "release $TAG 已存在，force_build=true，重新构建"
            else
              echo "release $TAG 已存在（上游 $SHA 已构建过），跳过"
              BUILD=false
            fi
          else
            echo "上游 $SHA (v$VERSION) 尚未构建，开始构建 $TAG"
          fi
          {
            echo "sha=$SHA"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 上游 \`$UPSTREAM_REPO@${SHA:0:7}\` v$VERSION"
            echo "tag: \`$TAG\` — build: **$BUILD**"
          } >> "$GITHUB_STEP_SUMMARY"

      # 公共仓库 60 天无活动会自动停用定时任务；因为我们不往 master 推提交，
      # 每次运行时重新 enable 一下本工作流来保活。失败不影响主流程。
      - name: Keepalive scheduled workflow
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/windows-desktop.yml/enable"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      DSH_DESKTOP_APP_ID: com.deepseek.desktop
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm (version pinned by packageManager field)
        shell: bash
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('pnpm@')[1]")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (native addon + libs + web frontend)
        run: pnpm run build

      # 本 fork 的打包配置：无签名构建指向官方生产更新源
      - name: Write .env.windows
        shell: bash
        run: |
          cat > apps/desktop/.env.windows <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.desktop
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://download.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedPageOrigins":["https://download.deepseek.com"]}
          EOF

      - name: Package Windows x64 (unsigned)
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64 -- --unsigned

      - name: Check installer
        shell: bash
        run: |
          set -euo pipefail
          DIR=apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts
          ls -la "$DIR"
          shopt -s nullglob
          files=("$DIR"/*.exe)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no .exe produced"; exit 1; }
          for f in "${files[@]}"; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes"
            # GitHub release 单个附件上限 2 GiB
            [ "$size" -lt 2000000000 ] || { echo "::error::$f exceeds release asset limit"; exit 1; }
          done

      # 只传 .exe，短期保留，仅用于把安装包交给 publish 任务
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win-x64-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-win-x64-unsigned
          path: dist

      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          ls -la dist

          # 上一次构建的上游 sha（取最新的 win-* release 正文中的标记）
          PREV=$(gh api "repos/$R/releases?per_page=50" \
            -q '[.[] | select(.tag_name | startswith("win-")) | select(.tag_name != env.TAG)][0].body // ""' \
            | sed -n 's/^upstream-sha: *\([0-9a-f]\{40\}\).*/\1/p' | head -n1 || true)

          {
            echo "DeepSeek Harness Desktop **v$VERSION** win-x64，无签名安装包。"
            echo
            echo "自动构建自上游 [\`$UPSTREAM_REPO@${SHA:0:7}\`](https://github.com/$UPSTREAM_REPO/commit/$SHA)。"
            echo "安装时 SmartScreen 拦截请选“更多信息 → 仍要运行”。"
            echo
            if [ -n "$PREV" ] && [ "$PREV" != "$SHA" ]; then
              echo "#### 自上次构建以来的上游提交（[${PREV:0:7}...${SHA:0:7}](https://github.com/$UPSTREAM_REPO/compare/$PREV...$SHA)）"
              echo
              gh api "repos/$UPSTREAM_REPO/compare/$PREV...$SHA" \
                -q '.commits | reverse | .[:60][] | "- \(.sha[0:7]) \(.commit.message | split("\n")[0])"' || true
              echo
            fi
            echo "构建日志：$GITHUB_SERVER_URL/$R/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "upstream-sha: $SHA"
          } > notes.md

          if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.exe --clobber -R "$R"
            gh release edit "$TAG" --notes-file notes.md -R "$R"
          else
            TITLE="DeepSeek Harness Desktop win-x64 (unsigned) v$VERSION @ ${SHA:0:7}"
            # tag 尽量直接指向上游提交（同一 fork 网络内可见）；不行就退回 fork 默认分支
            gh release create "$TAG" dist/*.exe -R "$R" --target "$SHA" \
                --title "$TITLE" --notes-file notes.md --latest \
              || gh release create "$TAG" dist/*.exe -R "$R" \
                --title "$TITLE" --notes-file notes.md --latest
          fi
          echo "发布: $GITHUB_SERVER_URL/$R/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  # 可选：让 fork 的 master 也跟上游同步（等同网页上的 “Sync fork”）。
  # 需要 secret SYNC_TOKEN（PAT，repo + workflow 权限，因为上游会改 .github/workflows）。
  # 没配置就跳过；失败也不影响构建和发布。
  sync-fork:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "未配置 SYNC_TOKEN，跳过同步 fork master（不影响 Windows 构建）"
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=master
