# DeepSeek Harness Desktop (Windows) — fork 自动化：先同步上游到 fork 的 master，再从 fork 构建
#
# 每天 UTC 02:17（北京时间 10:17）运行，也可手动运行：
#   1. sync    (ubuntu)  : 用 SYNC_TOKEN 把上游 deepseek-ai/deepseek-harness 的 master 合并进
#                          fork 的 master（普通 merge，保留 fork 自己的提交，绝不 force push）；
#                          然后禁用 fork 里除本工作流以外的所有工作流（包括上游新加的）；
#                          最后解析版本 / tag，判断是否需要构建。
#   2. build   (windows) : checkout fork（本仓库）同步后的 master 提交，写入打包配置，打无签名安装包
#   3. publish (ubuntu)  : 创建 GitHub Release（标记为 Latest）并上传 .exe
#
# tag = win-v<版本>-<上游短 sha>，以“合并进来的上游 sha”为准：上游没有新提交时
# release 已存在，直接跳过，不会重复构建。构建失败不产生 release，下次自动重试。
# release 正文里的 “upstream-sha: ...” 记录上次构建到哪个上游提交，用于生成更新列表。
#
# 必需：仓库 secret SYNC_TOKEN（classic PAT，repo + workflow 权限；workflow 权限是因为
# 上游会修改 .github/workflows/*）。没有该 secret 时 sync 任务直接失败并提示添加。
#
# 手动运行：Actions → windows-desktop → Run workflow
#   - force_build : 已有同名 release 时也重新构建并覆盖安装包
#
# 合并冲突时 sync 任务失败并列出冲突文件，fork 的 master 不会被改动，需要手动处理。
#
# 产物：deepseek-harness-<版本>-win-x64-unsigned.exe（NSIS 安装器，无签名，
#       SmartScreen 拦截时选“更多信息 → 仍要运行”）
# 固定下载页：https://github.com/<owner>/deepseek-harness/releases/latest

name: windows-desktop

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "已有同名 release 时也强制重新构建"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: windows-desktop
  cancel-in-progress: false

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  BRANCH: master
  SELF_WORKFLOW: .github/workflows/windows-desktop.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 所有写操作都用 SYNC_TOKEN，GITHUB_TOKEN 不需要任何权限
    permissions: {}
    outputs:
      fork_sha: ${{ steps.r.outputs.fork_sha }}
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      build: ${{ steps.r.outputs.build }}
    steps:
      - name: Require SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            msg="缺少仓库 secret SYNC_TOKEN。请到 Settings → Secrets and variables → Actions 添加 SYNC_TOKEN（classic PAT，勾选 repo + workflow 权限）后重新运行。"
            echo "::error title=SYNC_TOKEN missing::$msg"
            echo "### ❌ $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream master into fork master
        id: merge
        run: |
          set -euo pipefail
          git config user.name "nagatoquin33"
          git config user.email "nagatoquin33@users.noreply.github.com"
          git fetch --no-tags "https://github.com/$UPSTREAM_REPO.git" "$BRANCH"
          UP=$(git rev-parse FETCH_HEAD)
          echo "upstream_sha=$UP" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "fork 已包含上游 ${UP:0:7}，无需同步"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "### 同步：已是最新（上游 \`${UP:0:7}\`）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-ff --no-edit -m "Merge $UPSTREAM_REPO@${UP:0:7} into $BRANCH" "$UP"; then
            echo "::error title=Merge conflict::合并上游 ${UP:0:7} 到 fork $BRANCH 时冲突，未推送任何改动，请手动解决。冲突文件："
            git diff --name-only --diff-filter=U | sed 's/^/  /'
            git merge --abort || true
            exit 1
          fi
          # 普通 push（非 force）；如果远端在此期间变化会被拒绝并失败
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "### 同步：合并上游 \`${UP:0:7}\` → fork \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # 上游的工作流同步进来后默认是启用的；除本工作流外全部禁用，
      # 并取消这次 push 触发的其它工作流运行。
      - name: Disable all other workflows in the fork
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          PUSHED: ${{ steps.merge.outputs.pushed }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          HEAD_SHA=$(git rev-parse HEAD)
          rounds=1
          [ "$PUSHED" = "true" ] && rounds=3   # 新推送的工作流注册可能有延迟，多扫几轮
          for i in $(seq 1 "$rounds"); do
            [ "$i" -gt 1 ] && sleep 15
            gh api --paginate "repos/$R/actions/workflows?per_page=100" \
              -q '.workflows[] | select(.path != env.SELF_WORKFLOW) | select(.state == "active") | "\(.id) \(.path)"' \
            | while read -r id path; do
                echo "禁用 $path"
                gh api -X PUT "repos/$R/actions/workflows/$id/disable"
              done
            if [ "$PUSHED" = "true" ]; then
              gh api "repos/$R/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
                -q '.workflow_runs[] | select(.path != env.SELF_WORKFLOW) | select(.status != "completed") | "\(.id) \(.path)"' \
              | while read -r id path; do
                  echo "取消运行 $id ($path)"
                  gh api -X POST "repos/$R/actions/runs/$id/cancel" || true
                done
            fi
          done
          echo "当前处于启用状态的工作流："
          gh api --paginate "repos/$R/actions/workflows?per_page=100" -q '.workflows[] | select(.state == "active") | "  \(.path)"'

      # 公共仓库 60 天无活动会停用定时任务；上游没更新时不会有推送，所以每次都重新 enable 一下保活。
      - name: Keepalive scheduled workflow
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/windows-desktop.yml/enable"

      - name: Resolve version / tag
        id: r
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          UP: ${{ steps.merge.outputs.upstream_sha }}
          FORCE: ${{ inputs.force_build || false }}
        run: |
          set -euo pipefail
          FORK_SHA=$(git rev-parse HEAD)
          VERSION=$(jq -r .version package.json)
          TAG="win-v${VERSION}-${UP:0:7}"
          BUILD=true
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "release $TAG 已存在，force_build=true，重新构建"
            else
              echo "release $TAG 已存在（上游 $UP 已构建过），跳过"
              BUILD=false
            fi
          else
            echo "上游 $UP (v$VERSION) 尚未构建，开始构建 $TAG（fork $FORK_SHA）"
          fi
          {
            echo "fork_sha=$FORK_SHA"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
          {
            echo "fork \`${FORK_SHA:0:7}\` / 上游 \`${UP:0:7}\` v$VERSION"
            echo "tag: \`$TAG\` — build: **$BUILD**"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      DSH_DESKTOP_APP_ID: com.deepseek.desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.fork_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm (version pinned by packageManager field)
        shell: bash
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('pnpm@')[1]")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (native addon + libs + web frontend)
        run: pnpm run build

      # 本 fork 的打包配置：无签名构建指向官方生产更新源
      - name: Write .env.windows
        shell: bash
        run: |
          cat > apps/desktop/.env.windows <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.desktop
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://download.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedPageOrigins":["https://download.deepseek.com"]}
          EOF

      - name: Package Windows x64 (unsigned)
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64 -- --unsigned

      - name: Check installer
        shell: bash
        run: |
          set -euo pipefail
          DIR=apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts
          ls -la "$DIR"
          shopt -s nullglob
          files=("$DIR"/*.exe)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no .exe produced"; exit 1; }
          for f in "${files[@]}"; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes"
            # GitHub release 单个附件上限 2 GiB
            [ "$size" -lt 2000000000 ] || { echo "::error::$f exceeds release asset limit"; exit 1; }
          done

      # 只传 .exe，短期保留，仅用于把安装包交给 publish 任务
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win-x64-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: [sync, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-win-x64-unsigned
          path: dist

      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.sync.outputs.upstream_sha }}
          FORK_SHA: ${{ needs.sync.outputs.fork_sha }}
          VERSION: ${{ needs.sync.outputs.version }}
          TAG: ${{ needs.sync.outputs.tag }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          ls -la dist

          # 上一次构建的上游 sha（取最新的 win-* release 正文中的标记）
          PREV=$(gh api "repos/$R/releases?per_page=50" \
            -q '[.[] | select(.tag_name | startswith("win-")) | select(.tag_name != env.TAG)][0].body // ""' \
            | sed -n 's/^upstream-sha: *\([0-9a-f]\{40\}\).*/\1/p' | head -n1 || true)

          {
            echo "DeepSeek Harness Desktop **v$VERSION** win-x64，无签名安装包。"
            echo
            echo "构建自本 fork [\`${FORK_SHA:0:7}\`]($GITHUB_SERVER_URL/$R/commit/$FORK_SHA)，"
            echo "已同步上游 [\`$UPSTREAM_REPO@${SHA:0:7}\`](https://github.com/$UPSTREAM_REPO/commit/$SHA)。"
            echo "安装时 SmartScreen 拦截请选“更多信息 → 仍要运行”。"
            echo
            if [ -n "$PREV" ] && [ "$PREV" != "$SHA" ]; then
              echo "#### 自上次构建以来的上游提交（[${PREV:0:7}...${SHA:0:7}](https://github.com/$UPSTREAM_REPO/compare/$PREV...$SHA)）"
              echo
              gh api "repos/$UPSTREAM_REPO/compare/$PREV...$SHA" \
                -q '.commits | reverse | .[:60][] | "- \(.sha[0:7]) \(.commit.message | split("\n")[0])"' || true
              echo
            fi
            echo "构建日志：$GITHUB_SERVER_URL/$R/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "fork-sha: $FORK_SHA"
            echo "upstream-sha: $SHA"
          } > notes.md

          if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.exe --clobber -R "$R"
            gh release edit "$TAG" --notes-file notes.md -R "$R"
          else
            gh release create "$TAG" dist/*.exe -R "$R" --target "$FORK_SHA" \
              --title "DeepSeek Harness Desktop win-x64 (unsigned) v$VERSION @ ${SHA:0:7}" \
              --notes-file notes.md --latest
          fi
          echo "发布: $GITHUB_SERVER_URL/$R/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
